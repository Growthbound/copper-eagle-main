; Local development only. Dockerfile.production does not copy this file.
;
; The local server runs PHP from the command line, where the code cache is off
; by default, so every request recompiled the whole framework and a page took
; several seconds. Turn it on, and check files on every request so an edit
; still shows up on the next reload.
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
