; Upload limits for the admin media library.
;
; PHP ships with upload_max_filesize=2M, which is below the size of an ordinary
; phone photo. When a file exceeds it PHP discards the upload before Laravel
; sees a valid file, and validation reports the misleading "must be an image".
;
; These ceilings are deliberately higher than the 25 MB the media library
; accepts, so an oversized file fails the application's own validation and the
; owner gets "Each media file must be 25 MB or smaller" instead of a hang or a
; nonsense error. post_max_size carries several files plus multipart overhead,
; since the library accepts multiple files in one submission.

upload_max_filesize = 32M
post_max_size = 64M
memory_limit = 256M
max_file_uploads = 20

; The exact PHP build is of no use to a visitor and saves an attacker the
; trouble of fingerprinting which versions to try.
expose_php = Off
